name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      # Only the hermetic unit tests run in CI; the legacy script tests
      # hit the live BBC stream and are run locally via `npm run test:legacy`
      - run: npm run test:unit

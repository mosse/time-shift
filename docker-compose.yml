version: '3.8'

services:
  encore:
    build: .
    container_name: encore-fm
    restart: unless-stopped
    ports:
      - "3456:3000"
    volumes:
      - encore-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST_PORT=3456
      - TZ=America/Los_Angeles         # listener's clock, used in gap announcements
      # London-to-Pacific gap: 7h between the UK and US clock changes
      # (late Oct to early Nov, mid to late Mar), 8h otherwise.
      - DELAY_DURATION=28800000        # 8 hours in ms (25200000 for 7)
      # Uncomment to customize:
      # - BUFFER_DURATION=30600000     # 8.5 hours in ms
      # - STREAM_URL=https://example.com/stream.m3u8

volumes:
  encore-data:
